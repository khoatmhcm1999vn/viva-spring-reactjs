# Cau hinh NEN, an toan de deploy.
#
# Chi frontend mo cong ra ngoai. Database va backend chi noi voi nhau trong mang noi
# bo cua compose, va khong co Adminer. Truoc day cai nay publish ca bon service ra
# 0.0.0.0, nghia la tren mot VM cong khai thi Postgres, backend va mot UI quan tri DB
# deu phoi ra Internet.
#
# Chay o may dev:   docker compose up -d
#   -> compose tu nap them docker-compose.override.yml, mo cong db/backend va
#      them Adminer cho tien.
#
# Chay tren server:  docker compose -f docker-compose.yml up -d
#   -> chi dinh -f tuong minh nen override KHONG duoc nap.
#
# Dat ten project tuong minh. Tren may dev dang co mot stack khac ten
# "vivacon-services" (chay tu E:\JavaProj\Vivacon-Services) cung dung Postgres.
name: vivacon

services:
  db:
    image: postgres:14
    container_name: vivacon-db
    restart: unless-stopped
    # Khong co "ports": chi backend va adminer trong cung mang can noi tới.
    # Mo cong database ra host la viec cua moi truong dev, xem file override.
    environment:
      # Thieu POSTGRES_DB la loi cua file cu: Postgres chi tao database "postgres",
      # con ung dung lai ket noi vao "vivacon" nen chet voi
      # "database vivacon does not exist".
      POSTGRES_DB: ${POSTGRES_DB:-vivacon}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?can dat DB_PASSWORD trong file .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      # Named volume, khong phai anonymous. File cu khong khai bao volume nen du lieu
      # nam trong volume vo danh, va mot lan recreate container la mat dau vet.
      - vivacon-db-data:/var/lib/postgresql/data
      # Postgres chay moi file trong /docker-entrypoint-initdb.d theo thu tu ten,
      # va CHI chay khi data directory con trong (tuc lan up dau tien).
      # Cac function nay bat buoc phai co: dao/ goi chung theo ten, thieu la
      # thong ke, trending va chat loi runtime.
      - ./container/prepare/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./container/prepare/functions/message_functions.sql:/docker-entrypoint-initdb.d/02-message-functions.sql:ro
      - ./container/prepare/functions/statistic_function.sql:/docker-entrypoint-initdb.d/03-statistic-functions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vivacon}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vivacon-backend
    restart: unless-stopped
    # Khong co "ports": frontend goi backend qua mang noi bo bang ten service.
    # Mo cong 8091 de vao Swagger la viec cua moi truong dev, xem file override.
    depends_on:
      db:
        # Doi Postgres thuc su nhan ket noi, khong chi doi container start.
        # Khong co dieu kien nay thi backend hay chet o lan up dau vi Hibernate
        # can mot ket noi ngay luc khoi dong (ddl-auto: update).
        condition: service_healthy
    environment:
      # Image mac dinh la profile prod. Giu nguyen: profile dev bat
      # vivacon.verification.bypass nen khong dung cho thu gi giong deploy.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Trong mang cua compose, host cua DB la ten service "db", khong phai localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-vivacon}
      DB_PASSWORD: ${DB_PASSWORD:?can dat DB_PASSWORD trong file .env}
      JWT_SECRET_SALT: ${JWT_SECRET_SALT:?can dat JWT_SECRET_SALT trong file .env}
      # Origin ma nguoi dung thuc su mo frontend. De trong hoac dien sai la moi ket
      # noi WebSocket bi tu choi va chat chet IM LANG: trang van tai binh thuong.
      # Tren server day phai la domain that, vi du https://vivacon.example.com
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-http://localhost:8081}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MS_OAUTH_CLIENT_ID: ${MS_OAUTH_CLIENT_ID:-}
      MS_OAUTH_CLIENT_SECRET: ${MS_OAUTH_CLIENT_SECRET:-}
      MS_OAUTH_REFRESH_TOKEN: ${MS_OAUTH_REFRESH_TOKEN:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vivacon-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # nginx proxy /api va /ws sang day, bang ten service trong mang noi bo.
      BACKEND_ORIGIN: backend:8080
    ports:
      # Service duy nhat mo ra ngoai. Tren server dat FRONTEND_PORT=80.
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  vivacon-db-data:
    name: vivacon-db-data
