# Cloudflare Tunnel: cho stack mot hostname HTTPS cong khai, khong can mo cong tren
# router, khong can IP tinh, va co chung chi hop le.
#
# File nay LA TUY CHON, phai chi dinh tuong minh:
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
#
# Khong gop vao docker-compose.yml de ban deploy mac dinh khong tu nhien phoi ra
# Internet. Mo ra Internet phai la mot hanh dong co y.
#
# Vi sao can den no: Vercel chi phuc vu HTTPS, con VM nay o 192.168.221.128 - mot
# dia chi rieng. Trang HTTPS khong goi duoc http://192.168.221.128 (mixed content),
# edge cua Vercel cung khong voi tới day duoc, va Vercel KHONG proxy duoc WebSocket
# nen SockJS buoc phai noi thang vao backend. Ba ly do, cung mot ket luan: backend
# can mot endpoint https/wss that.
#
# Khong can sudo: day la container, khong phai goi apt.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vivacon-cloudflared
    restart: unless-stopped
    depends_on:
      - frontend
    # Tro vao nginx cua frontend trong mang noi bo, chu khong vao backend truc tiep.
    # nginx da proxy /api va /ws san, nen mot hostname phuc vu duoc ca static, API
    # va WebSocket - khong phai cau hinh lai gi.
    #
    # Hai che do:
    #
    # 1. Quick tunnel (mac dinh, khong can tai khoan): TUNNEL_TOKEN de trong.
    #    Duoc mot hostname *.trycloudflare.com ngau nhien, va no DOI moi lan khoi
    #    dong lai. Du de kiem chung ca duong di, khong du de dung lau: moi lan doi
    #    hostname la phai build lai frontend tren Vercel, vi REACT_APP_* bi nhung
    #    cung vao bundle luc build.
    #
    # 2. Named tunnel (can tai khoan + domain): dat TUNNEL_TOKEN trong .env.
    #    Hostname co dinh, dung duoc lau dai.
    #
    # --no-autoupdate: container thi nang cap bang cach keo image moi, khong phai
    # de tien trinh tu thay the binary roi tu restart.
    command: >
      sh -c 'if [ -n "$${TUNNEL_TOKEN}" ]; then
               exec cloudflared --no-autoupdate tunnel run --token "$${TUNNEL_TOKEN}";
             else
               exec cloudflared --no-autoupdate tunnel --url http://frontend:80 ${TUNNEL_EXTRA_ARGS:-};
             fi'
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      # Metric de doc duoc trang thai tunnel tu trong mang noi bo.
      TUNNEL_METRICS: 0.0.0.0:2000
    mem_limit: ${TUNNEL_MEM_LIMIT:-128m}
